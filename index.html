<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa Pré-Fabricada 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3f5; font-family: system-ui, sans-serif; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #ui { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #ui button { padding: 8px 14px; border: 0; border-radius: 8px; background: #fff; font-size: 14px; cursor: pointer; box-shadow: 0 2px 6px #0003; }
  #ui button.on { background: #2b6cb0; color: #fff; }
  #hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: #0007; color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 13px; }
</style>
</head>
<body>
<div id="ui"></div>
<div id="hint">Arraste para girar 360° · Scroll para zoom · Botão direito para mover</div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3f5);
scene.fog = new THREE.Fog(0x9fd3f5, 40, 90);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(16, 9, 19);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.8, 0);
controls.enableDamping = true;
controls.minDistance = 5;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI / 2 - 0.03; // não passa por baixo do chão
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
renderer.domElement.addEventListener('pointerdown', () => controls.autoRotate = false);

// Luz
scene.add(new THREE.HemisphereLight(0xffffff, 0x6a8f4a, 0.8));
const sun = new THREE.DirectionalLight(0xfff2d6, 2.2);
sun.position.set(15, 22, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 60 });
scene.add(sun);

// Grama (textura procedural)
function grassTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#5a9a3c'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 6000; i++) {
    g.fillStyle = `hsl(${90 + Math.random() * 30},${45 + Math.random() * 25}%,${28 + Math.random() * 22}%)`;
    g.fillRect(Math.random() * 256, Math.random() * 256, 2, 4);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30, 30);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const ground = new THREE.Mesh(new THREE.CircleGeometry(80, 64), new THREE.MeshStandardMaterial({ map: grassTexture(), roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Helpers
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...o });
function box(w, h, d, m, x, y, z, parent) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x, y, z); mesh.castShadow = mesh.receiveShadow = true;
  parent.add(mesh); return mesh;
}
function gableRoof(w, d, h, overhang, m, parent, y) {
  const s = new THREE.Shape();
  s.moveTo(-w / 2 - overhang, 0); s.lineTo(w / 2 + overhang, 0); s.lineTo(0, h); s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: d + overhang * 2, bevelEnabled: false });
  const mesh = new THREE.Mesh(geo, m);
  mesh.position.set(0, y, -d / 2 - overhang);
  mesh.castShadow = mesh.receiveShadow = true;
  parent.add(mesh); return mesh;
}
function windowAt(x, y, z, ry, parent, w = 1.2, h = 1.3) {
  const g = new THREE.Group();
  box(w + 0.2, h + 0.2, 0.1, mat(0xffffff), 0, 0, 0, g);
  box(w, h, 0.14, mat(0x88c4ec, { roughness: 0.1, metalness: 0.3 }), 0, 0, 0, g);
  box(0.06, h, 0.16, mat(0xffffff), 0, 0, 0, g);
  box(w, 0.06, 0.16, mat(0xffffff), 0, 0, 0, g);
  g.position.set(x, y, z); g.rotation.y = ry; parent.add(g);
}
function door(x, y, z, parent, color) {
  box(1.2, 2.2, 0.12, color, x, y, z, parent);
  box(0.08, 0.08, 0.2, mat(0xd4af37, { metalness: 0.8, roughness: 0.3 }), x + 0.4, y, z, parent);
}
function tree(x, z, s = 1) {
  const g = new THREE.Group();
  box(0.4 * s, 2 * s, 0.4 * s, mat(0x6b4423), 0, s, 0, g);
  for (let i = 0; i < 3; i++) {
    const c = new THREE.Mesh(new THREE.IcosahedronGeometry((1.6 - i * 0.3) * s, 1), mat(0x2f7d32));
    c.position.y = (2.6 + i * 0.9) * s; c.castShadow = true; g.add(c);
  }
  g.position.set(x, 0, z); scene.add(g);
}
function fence(x0, z0, x1, z1) {
  const len = Math.hypot(x1 - x0, z1 - z0), n = Math.floor(len / 0.6);
  const g = new THREE.Group(), m = mat(0xf5f0e6);
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    box(0.12, 0.9, 0.06, m, x0 + (x1 - x0) * t, 0.45, z0 + (z1 - z0) * t, scene).rotation.y = Math.atan2(x1 - x0, z1 - z0) + Math.PI / 2;
  }
  [0.3, 0.7].forEach(h => {
    const r = box(0.05, 0.08, len, m, (x0 + x1) / 2, h, (z0 + z1) / 2, scene);
    r.rotation.y = Math.atan2(x1 - x0, z1 - z0);
  });
}

// ---------- Casa 1: Clássica ----------
function classicHouse() {
  const h = new THREE.Group();
  box(8, 3, 6, mat(0xf2e3c6), 0, 1.5, 0, h);               // paredes
  box(8.2, 0.3, 6.2, mat(0x999999), 0, 0.15, 0, h);         // fundação
  gableRoof(8, 6, 2.6, 0.5, mat(0xa0432d), h, 3);           // telhado
  box(0.9, 2.2, 0.9, mat(0x8a3b2a), 2.2, 4.6, -1, h);       // chaminé
  door(0, 1.1, 3.06, h, mat(0x5a3a22));
  windowAt(-2.6, 1.7, 3.05, 0, h); windowAt(2.6, 1.7, 3.05, 0, h);
  windowAt(-2, 1.7, -3.05, Math.PI, h); windowAt(2, 1.7, -3.05, Math.PI, h);
  windowAt(4.05, 1.7, 0, Math.PI / 2, h); windowAt(-4.05, 1.7, 0, -Math.PI / 2, h);
  // varanda
  box(3, 0.2, 1.6, mat(0xb08b5a), 0, 0.2, 3.9, h);
  [-1.3, 1.3].forEach(x => box(0.15, 2.7, 0.15, mat(0xffffff), x, 1.55, 4.55, h));
  box(3.4, 0.15, 2, mat(0xa0432d), 0, 2.95, 3.9, h).rotation.x = 0.12;
  // caminho
  box(1.4, 0.05, 6, mat(0xc9c2b4), 0, 0.03, 8, h);
  return h;
}

// ---------- Casa 2: Moderna ----------
function modernHouse() {
  const h = new THREE.Group();
  box(9, 3, 5, mat(0xe8e8e8), 0, 1.5, 0, h);
  box(5, 3, 5, mat(0x3a3f47), 2.2, 4.5, 0, h);              // andar de cima
  box(9.6, 0.3, 5.6, mat(0x222222), 0, 3.15, 0, h);         // laje
  box(5.6, 0.3, 5.6, mat(0x222222), 2.2, 6.15, 0, h);       // teto plano
  door(-2.5, 1.1, 2.56, h, mat(0x6b4a2e));
  windowAt(0.5, 1.7, 2.56, 0, h, 2.6, 1.6);
  windowAt(3.2, 4.5, 2.56, 0, h, 2.8, 1.5);
  windowAt(-2.5, 1.7, -2.56, Math.PI, h, 2.4, 1.4);
  windowAt(3, 4.5, -2.56, Math.PI, h, 2.8, 1.5);
  windowAt(4.55, 1.7, 0, Math.PI / 2, h, 2, 1.4);
  box(4, 0.05, 6, mat(0xb9b9b9), -2.5, 0.03, 6, h);
  return h;
}

const houses = { 'Casa Clássica': classicHouse(), 'Casa Moderna': modernHouse() };
Object.values(houses).forEach(h => { h.visible = false; scene.add(h); });

// Cenário
tree(-14, -8, 1.2); tree(15, -10, 1.5); tree(-17, 6, 1); tree(-13, -16, 1.3); tree(19, 4, 1.2);
fence(-12, 14, 12, 14); fence(-12, -12, 12, -12); fence(-12, -12, -12, 14); fence(12, -12, 12, 14);

// UI
const ui = document.getElementById('ui');
Object.keys(houses).forEach((name, i) => {
  const b = document.createElement('button'); b.textContent = name;
  b.onclick = () => {
    Object.entries(houses).forEach(([n, h]) => h.visible = n === name);
    [...ui.children].forEach(c => c.classList.toggle('on', c === b));
  };
  ui.appendChild(b); if (i === 0) b.click();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
