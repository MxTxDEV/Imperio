<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa Pré-Fabricada 3D</title>
<style>
  :root { --glass: rgba(20,24,28,.62); --acc: #e8a33d; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b9d3e6; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  #panel { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; flex-wrap: wrap; pointer-events: none; }
  .group { pointer-events: auto; display: flex; align-items: center; gap: 4px; padding: 5px 6px; background: var(--glass); backdrop-filter: blur(8px); border-radius: 12px; color: #fff; }
  .group span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .7; padding: 0 6px; }
  .group button { border: 0; border-radius: 8px; padding: 7px 11px; background: transparent; color: #fff; font-size: 13px; cursor: pointer; }
  .group button:hover { background: rgba(255,255,255,.15); }
  .group button.on { background: var(--acc); color: #1b1b1b; font-weight: 600; }
  #brand { position: fixed; bottom: 14px; right: 16px; color: #fff; text-align: right; text-shadow: 0 1px 6px #0008; line-height: 1.1; pointer-events: none; }
  #brand b { font-size: 20px; letter-spacing: .28em; }
  #brand small { display: block; font-size: 10px; letter-spacing: .2em; opacity: .85; }
  #hint { position: fixed; bottom: 14px; left: 16px; background: var(--glass); color: #fff; padding: 7px 14px; border-radius: 20px; font-size: 12px; pointer-events: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #1b1f23; color: #fff; font-size: 15px; letter-spacing: .1em; transition: opacity .6s; }
</style>
</head>
<body>
<div id="loading">Carregando modelo 3D…</div>
<div id="panel"></div>
<div id="hint">Arraste: girar 360° · Scroll: zoom · Botão direito: mover</div>
<div id="brand"><b>IMPÉRIO</b><small>NEGÓCIOS IMOBILIÁRIOS</small></div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';

const { MathUtils } = THREE;

/* ================= Renderer / cena ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;
document.body.appendChild(renderer.domElement);
const aniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc4d8e6, 140, 380);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 6000);
camera.position.set(22, 9, 27);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-1, 1.8, 1);
controls.enableDamping = true;
controls.minDistance = 5;
controls.maxDistance = 55;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
renderer.domElement.addEventListener('pointerdown', () => { controls.autoRotate = false; syncRotBtn(); });

/* ================= Utilidades ================= */
let seed = 1337;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return MathUtils.lerp(MathUtils.lerp(hash(xi, yi), hash(xi + 1, yi), u), MathUtils.lerp(hash(xi, yi + 1), hash(xi + 1, yi + 1), u), v);
}
const fbm = (x, y) => { let a = .5, f = 1, s = 0; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, y * f); f *= 2; a *= .5; } return s; };
const CX = 2, CZ = 3; // centro do terreno
const terrainH = (x, z) => MathUtils.smoothstep(Math.hypot(x - CX, z - CZ), 34, 140) * fbm(x * .012 + 5, z * .012 + 7) * 46;

const mk = (w, h, fn) => { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; };
function tex(canvas, mw, mh, srgb = true) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = aniso;
  t.repeat.set(1 / mw, 1 / (mh ?? mw));
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function speckle(g, w, h, n, a = .08) {
  for (let i = 0; i < n; i++) {
    const v = rnd() > .5 ? 255 : 0;
    g.fillStyle = `rgba(${v},${v},${v},${a * rnd()})`;
    g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2);
  }
}
const clamp255 = v => Math.max(0, Math.min(255, v)) | 0;

/* ================= Texturas procedurais ================= */
// Placas de cimento (parede): células 0,9 x 0,6 m, tile de 1,8 x 1,8 m
function panelCanvas(bump) {
  return mk(1024, 1024, (g, w, h) => {
    const cols = 2, rows = 3, cw = w / cols, ch = h / rows;
    g.fillStyle = bump ? '#9a9a9a' : '#c6c0b3'; g.fillRect(0, 0, w, h);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const l = rnd();
      g.fillStyle = bump ? `rgb(${140 + l * 40 | 0},${140 + l * 40 | 0},${140 + l * 40 | 0})` : `rgb(${190 + l * 18 | 0},${184 + l * 18 | 0},${172 + l * 16 | 0})`;
      g.fillRect(c * cw, r * ch, cw, ch);
      for (let k = 0; k < 6; k++) {
        const gr = g.createRadialGradient(c * cw + rnd() * cw, r * ch + rnd() * ch, 4, c * cw + rnd() * cw, r * ch + rnd() * ch, 120 + rnd() * 120);
        gr.addColorStop(0, `rgba(${rnd() > .5 ? '255,255,255' : '90,80,65'},${bump ? .08 : .07})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = gr; g.fillRect(c * cw, r * ch, cw, ch);
      }
    }
    speckle(g, w, h, 70000, bump ? .25 : .14);
    for (let i = 0; i < 40; i++) { // escorrimentos verticais
      const x = rnd() * w, gr = g.createLinearGradient(0, 0, 0, h);
      gr.addColorStop(0, 'rgba(60,50,40,0)'); gr.addColorStop(.5, `rgba(60,50,40,${bump ? 0 : .06})`); gr.addColorStop(1, 'rgba(60,50,40,0)');
      g.fillStyle = gr; g.fillRect(x, 0, 2 + rnd() * 5, h);
    }
    g.lineWidth = 6; g.strokeStyle = bump ? '#2a2a2a' : 'rgba(62,56,48,.75)'; // juntas
    for (let c = 0; c <= cols; c++) { g.beginPath(); g.moveTo(c * cw, 0); g.lineTo(c * cw, h); g.stroke(); }
    for (let r = 0; r <= rows; r++) { g.beginPath(); g.moveTo(0, r * ch); g.lineTo(w, r * ch); g.stroke(); }
    if (!bump) { g.fillStyle = 'rgba(70,64,56,.5)'; for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) for (const [dx, dy] of [[.08, .12], [.92, .12], [.08, .88], [.92, .88]]) { g.beginPath(); g.arc(c * cw + dx * cw, r * ch + dy * ch, 3, 0, 7); g.fill(); } }
  });
}

// Telha colonial: 16 colunas de 0,2 m x 8 fiadas de 0,3 m => 3,2 x 2,4 m
function tileCanvas([r, gg, b], bump) {
  return mk(1024, 768, (g, w, h) => {
    const cols = 16, rows = 8, cw = w / cols, rh = h / rows;
    g.fillStyle = bump ? '#808080' : `rgb(${r},${gg},${b})`; g.fillRect(0, 0, w, h);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const v = (rnd() - .5) * .22, x = i * cw, y = j * rh;
      const k = m => `rgb(${clamp255(r * (m + v))},${clamp255(gg * (m + v))},${clamp255(b * (m + v))})`;
      const gr = g.createLinearGradient(x, 0, x + cw, 0);
      if (bump) { gr.addColorStop(0, '#383838'); gr.addColorStop(.5, '#e4e4e4'); gr.addColorStop(1, '#383838'); }
      else { gr.addColorStop(0, k(.7)); gr.addColorStop(.5, k(1.14)); gr.addColorStop(1, k(.7)); }
      g.fillStyle = gr; g.fillRect(x, y, cw, rh);
      const sg = g.createLinearGradient(0, y + rh * .62, 0, y + rh);
      sg.addColorStop(0, 'rgba(0,0,0,0)'); sg.addColorStop(1, bump ? 'rgba(0,0,0,.7)' : 'rgba(0,0,0,.5)');
      g.fillStyle = sg; g.fillRect(x, y, cw, rh);
    }
    speckle(g, w, h, 40000, bump ? .2 : .16);
    if (!bump) for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(${60 + rnd() * 40},${70 + rnd() * 40},40,${.10 * rnd()})`; g.beginPath(); g.arc(rnd() * w, rnd() * h, 3 + rnd() * 9, 0, 7); g.fill(); }
  });
}

// Chapa metálica zipada (2 x 2 m, painéis de 0,5 m)
function metalCanvas(bump) {
  return mk(512, 512, (g, w, h) => {
    g.fillStyle = bump ? '#808080' : '#8d949a'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 4; i++) {
      const x = i * w / 4, gr = g.createLinearGradient(x, 0, x + w / 4, 0);
      if (bump) { gr.addColorStop(0, '#f0f0f0'); gr.addColorStop(.08, '#303030'); gr.addColorStop(.16, '#909090'); gr.addColorStop(1, '#808080'); }
      else { gr.addColorStop(0, '#cfd4d8'); gr.addColorStop(.08, '#5b6166'); gr.addColorStop(.2, '#8d949a'); gr.addColorStop(1, '#868d93'); }
      g.fillStyle = gr; g.fillRect(x, 0, w / 4, h);
    }
    speckle(g, w, h, 8000, .1);
  });
}

// Madeira (veios verticais)
function woodCanvas(base, planks) {
  return mk(512, 512, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 500; i++) {
      const x = rnd() * w, dark = rnd() > .45;
      g.strokeStyle = dark ? `rgba(30,15,5,${.05 + rnd() * .2})` : `rgba(210,150,90,${.03 + rnd() * .1})`;
      g.lineWidth = .5 + rnd() * 2.5;
      g.beginPath(); g.moveTo(x, 0);
      g.bezierCurveTo(x + (rnd() - .5) * 14, h * .3, x + (rnd() - .5) * 14, h * .7, x + (rnd() - .5) * 8, h); g.stroke();
    }
    if (planks) { g.strokeStyle = 'rgba(20,10,4,.8)'; g.lineWidth = 3; for (let i = 0; i <= planks; i++) { g.beginPath(); g.moveTo(i * w / planks, 0); g.lineTo(i * w / planks, h); g.stroke(); } }
  });
}

// Concreto (laje)
function concreteCanvas() {
  return mk(1024, 1024, (g, w, h) => {
    g.fillStyle = '#b9b7b1'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 90; i++) {
      const gr = g.createRadialGradient(rnd() * w, rnd() * h, 5, rnd() * w, rnd() * h, 90 + rnd() * 160);
      gr.addColorStop(0, `rgba(${rnd() > .5 ? '230,228,222' : '110,104,96'},.10)`); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
    }
    speckle(g, w, h, 90000, .16);
    g.strokeStyle = 'rgba(70,66,60,.55)'; g.lineWidth = 2; // juntas de dilatação
    for (let i = 0; i <= 1; i++) { g.beginPath(); g.moveTo(i * w, 0); g.lineTo(i * w, h); g.stroke(); g.beginPath(); g.moveTo(0, i * h); g.lineTo(w, i * h); g.stroke(); }
    g.strokeStyle = 'rgba(70,66,60,.25)'; g.lineWidth = 1;
    for (let i = 0; i < 6; i++) { g.beginPath(); let x = rnd() * w, y = rnd() * h; g.moveTo(x, y); for (let k = 0; k < 8; k++) { x += (rnd() - .5) * 70; y += (rnd() - .3) * 60; g.lineTo(x, y); } g.stroke(); }
  });
}

// Piso intertravado sextavado
function hexCanvas() {
  const s = 36.95, hw = Math.sqrt(3) * s;
  return mk(512, 554, (g, w, h) => {
    g.fillStyle = '#5c5a56'; g.fillRect(0, 0, w, h);
    for (let row = -1; row <= 11; row++) for (let col = -1; col <= 9; col++) {
      const cx = col * hw + (row & 1 ? hw / 2 : 0), cy = row * 1.5 * s, l = 150 + rnd() * 40;
      g.fillStyle = `rgb(${l | 0},${l * .98 | 0},${l * .93 | 0})`;
      g.beginPath();
      for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3, px = cx + (s - 1.8) * Math.cos(a), py = cy + (s - 1.8) * Math.sin(a); k ? g.lineTo(px, py) : g.moveTo(px, py); }
      g.closePath(); g.fill();
    }
    speckle(g, w, h, 30000, .18);
  });
}

function groundDetail() {
  return mk(512, 512, (g, w, h) => {
    g.fillStyle = '#d8d8d8'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 14000; i++) { const v = 150 + rnd() * 105 | 0; g.fillStyle = `rgba(${v},${v},${v},.5)`; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 2 + rnd() * 5); }
  });
}
function grassTuftCanvas() {
  return mk(128, 128, (g, w, h) => {
    for (let i = 0; i < 34; i++) {
      const x = 20 + rnd() * 88, tipx = x + (rnd() - .5) * 60, tipy = 8 + rnd() * 50;
      g.strokeStyle = `hsl(${78 + rnd() * 30},${45 + rnd() * 25}%,${16 + rnd() * 22}%)`;
      g.lineWidth = 2 + rnd() * 2.5;
      g.beginPath(); g.moveTo(x, h); g.quadraticCurveTo(x + (tipx - x) * .2, h * .5, tipx, tipy); g.stroke();
    }
  });
}
function barkCanvas() {
  return mk(256, 256, (g, w, h) => {
    g.fillStyle = '#5a4a3a'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) { g.strokeStyle = `rgba(${rnd() > .5 ? '20,14,8' : '150,130,105'},${.1 + rnd() * .25})`; g.lineWidth = 1 + rnd() * 3; const x = rnd() * w; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + (rnd() - .5) * 10, h); g.stroke(); }
  });
}
function waterCanvas() {
  return mk(256, 256, (g, w, h) => {
    const gr = g.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, w * .62);
    gr.addColorStop(0, '#0f6d8d'); gr.addColorStop(.7, '#1f93b0'); gr.addColorStop(1, '#5cc6d6');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 60; i++) { g.strokeStyle = `rgba(255,255,255,${.05 + rnd() * .07})`; g.lineWidth = 1; g.beginPath(); const y = rnd() * h; g.moveTo(0, y); g.bezierCurveTo(w * .3, y + 10, w * .6, y - 10, w, y + 6); g.stroke(); }
  });
}

/* ================= Materiais ================= */
const std = o => new THREE.MeshStandardMaterial(o);
const wallMat = std({ map: tex(panelCanvas(false), 1.8), bumpMap: tex(panelCanvas(true), 1.8, 1.8, false), bumpScale: 2.2, roughness: .95, envMapIntensity: .3 });

const roofPalette = { 'Cerâmica': [132, 70, 46], 'Branca': [222, 222, 217], 'Grafite': [72, 74, 78] };
const roofCache = {};
const roofTextures = name => roofCache[name] ??= { map: tex(tileCanvas(roofPalette[name], false), 3.2, 2.4), bump: tex(tileCanvas(roofPalette[name], true), 3.2, 2.4, false) };
const roofMat = std({ roughness: .78, bumpScale: 3, side: THREE.DoubleSide, envMapIntensity: .35 });
function setRoof(name) { const t = roofTextures(name); roofMat.map = t.map; roofMat.bumpMap = t.bump; roofMat.needsUpdate = true; }
setRoof('Cerâmica');

const metalMat = std({ map: tex(metalCanvas(false), 2), bumpMap: tex(metalCanvas(true), 2, 2, false), bumpScale: 2, metalness: .55, roughness: .42, side: THREE.DoubleSide });
const woodPost = tex(woodCanvas('#5b3a22'), 1, 1);
const postMat = std({ map: woodPost, roughness: .75 });
const beamMat = std({ map: tex(woodCanvas('#4d301b'), 2), roughness: .75 });
const ceilMat = std({ map: tex(woodCanvas('#8a5b36', 8), 2), roughness: .8 });
const concreteMat = std({ map: tex(concreteCanvas(), 2), roughness: .95, envMapIntensity: .25 });
const paverMat = std({ map: tex(hexCanvas(), 2, 2.16), roughness: .95, envMapIntensity: .25 });
const frameMat = std({ color: 0x1b1d1f, metalness: .7, roughness: .4 });
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x2a3d4c, metalness: .85, roughness: .04, clearcoat: 1, envMapIntensity: 1.6 });
const doorMat = std({ color: 0x1d2c44, roughness: .55 });
const trimMat = std({ color: 0x8b8a84, roughness: .9, envMapIntensity: .3 });
const whiteMat = std({ color: 0xeeeeea, roughness: .7 });
const barkTex = tex(barkCanvas(), 1, 1);

/* ================= Iluminação / céu ================= */
const hemi = new THREE.HemisphereLight(0xf2eee6, 0x9a8a68, .4);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -34, right: 34, top: 34, bottom: -34, near: 1, far: 200 });
sun.shadow.bias = -0.0002; sun.shadow.normalBias = .04;
sun.target.position.set(0, 0, 1);
scene.add(sun, sun.target);

const sky = new Sky();
sky.scale.setScalar(4000);
scene.add(sky);
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;

const presets = {
  'Dia':        { elev: 44, azim: 215, exposure: .55, sunI: 3.0, sunC: 0xfff1dc, fog: 0xc4d8e6, hemi: .4, turb: 3, ray: 1.1, mie: .004 },
  'Entardecer': { elev: 7,  azim: 262, exposure: .5,  sunI: 3.4, sunC: 0xffb070, fog: 0xe6c3a4, hemi: .28, turb: 6, ray: 2.2, mie: .01 },
};
function setTime(name) {
  const p = presets[name], u = sky.material.uniforms;
  u.turbidity.value = p.turb; u.rayleigh.value = p.ray; u.mieCoefficient.value = p.mie; u.mieDirectionalG.value = .8;
  const dir = new THREE.Vector3().setFromSphericalCoords(1, MathUtils.degToRad(90 - p.elev), MathUtils.degToRad(p.azim));
  u.sunPosition.value.copy(dir);
  sun.position.copy(dir).multiplyScalar(90).add(sun.target.position);
  sun.color.set(p.sunC); sun.intensity = p.sunI; hemi.intensity = p.hemi;
  renderer.toneMappingExposure = p.exposure;
  scene.fog.color.set(p.fog);
  const envScene = new THREE.Scene(); envScene.add(sky);
  const rt = pmrem.fromScene(envScene); scene.add(sky);
  scene.environment = rt.texture; envRT?.dispose(); envRT = rt;
}

/* ================= Terreno ================= */
const ground = new THREE.Mesh(
  (() => {
    const g = new THREE.PlaneGeometry(700, 700, 320, 320); g.rotateX(-Math.PI / 2);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) p.setY(i, terrainH(p.getX(i), p.getZ(i)));
    g.computeVertexNormals();
    g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(p.count * 3), 3));
    return g;
  })(),
  std({ vertexColors: true, roughness: 1, map: (() => { const t = tex(groundDetail(), 1); t.repeat.set(230, 230); return t; })() })
);
ground.receiveShadow = true;
scene.add(ground);

function paintGround(mode) {
  const p = ground.geometry.attributes.position, col = ground.geometry.attributes.color, c = new THREE.Color();
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), d = Math.hypot(x - CX, z - CZ);
    const n = fbm(x * .05 + 9, z * .05 + 3), n2 = vnoise(x * .35, z * .35);
    const lawn = [.30 + n2 * .05 + n * .06, .42 + n * .10, .16], red = [.52 + n2 * .06, .25 + n2 * .03, .13];
    const dry = [.50 + n * .12, .45 + n * .1, .24], hill = [.34 + n * .1, .40 + n * .08, .19];
    let c1 = mix(mode === 'lawn' ? lawn : red, dry, MathUtils.smoothstep(d, 24, 44));
    c1 = mix(c1, hill, MathUtils.smoothstep(d, 80, 170));
    if (z > 14) c1 = mix(c1, [.55 + n2 * .05, .32, .18], 1 - MathUtils.smoothstep(Math.abs(x - 2), 2.6, 3.8)); // estrada de terra
    c.setRGB(c1[0], c1[1], c1[2], THREE.SRGBColorSpace);
    col.setXYZ(i, c.r, c.g, c.b);
  }
  col.needsUpdate = true;
}

/* ================= Helpers de modelagem ================= */
function metricUV(geo) {
  geo.computeBoundingBox();
  const bb = geo.boundingBox, p = geo.attributes.position, n = geo.attributes.normal, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) {

function polyGeometry(faces) {
  const pos = [], uv = [], nor = [];
  for (const f of faces) {
    const P = f.map(v => new THREE.Vector3(...v));
    const nrm = new THREE.Vector3().crossVectors(P[1].clone().sub(P[0]), P[2].clone().sub(P[0])).normalize();
    const u = P[1].clone().sub(P[0]).normalize(), v = new THREE.Vector3().crossVectors(nrm, u);
    const put = q => { pos.push(q.x, q.y, q.z); nor.push(nrm.x, nrm.y, nrm.z); const d = q.clone().sub(P[0]); uv.push(d.dot(u), d.dot(v)); };
    for (let i = 1; i < P.length - 1; i++) { put(P[0]); put(P[i]); put(P[i + 1]); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  return g;
}

function hipRoof({ x, y, z, W, D, pitch, mat, capMat = trimMat, parent = scene, ceiling = null }) {
  const grp = new THREE.Group(); grp.position.set(x, y, z);
  if (D > W) { [W, D] = [D, W]; grp.rotation.y = Math.PI / 2; }
  const hx = W / 2, hz = D / 2, r = (W - D) / 2, rise = hz * Math.tan(MathUtils.degToRad(pitch));
  const Dd = [-hx, 0, hz], C = [hx, 0, hz], B = [hx, 0, -hz], A = [-hx, 0, -hz], R1 = [-r, rise, 0], R2 = [r, rise, 0];
  const mesh = new THREE.Mesh(polyGeometry([[Dd, C, R2, R1], [B, A, R1, R2], [C, B, R2], [A, Dd, R1]]), mat);
  mesh.castShadow = mesh.receiveShadow = true; grp.add(mesh);
  if (r > .01) box(2 * r + .15, .14, .2, capMat, 0, rise + .03, 0, grp);
  for (const [s, e] of [[R1, A], [R1, Dd], [R2, B], [R2, C]]) beam([s[0], s[1] + .04, s[2]], [e[0], e[1] + .04, e[2]], .15, capMat, grp, false);
  box(W, .22, .05, beamMat, 0, -.08, hz, grp); box(W, .22, .05, beamMat, 0, -.08, -hz, grp);
  box(.05, .22, D, beamMat, hx, -.08, 0, grp); box(.05, .22, D, beamMat, -hx, -.08, 0, grp);
  if (ceiling) {
    const cg = metricUV(new THREE.PlaneGeometry(W - .08, D - .08)); cg.rotateX(Math.PI / 2);
    const c = new THREE.Mesh(cg, ceiling); c.position.y = -.14; c.receiveShadow = true; grp.add(c);
  }
  parent.add(grp); return grp;
}

function roundedRect(shape, cx, cy, w, h, r) {
  const x0 = cx - w / 2, x1 = cx + w / 2, y0 = cy - h / 2, y1 = cy + h / 2;
  shape.moveTo(x0 + r, y0); shape.lineTo(x1 - r, y0); shape.absarc(x1 - r, y0 + r, r, -Math.PI / 2, 0);

  shape.lineTo(x0, y0 + r); shape.absarc(x0 + r, y0 + r, r, Math.PI, Math.PI * 1.5);

}

function group(label, items, onPick, initial) {

    const b = document.createElement('button'); b.textContent = name;

}
const views = {
  'Frente':  { p: [16, 5, 30],    t: [-1, 1.8, 1] },
  'Aérea':   { p: [10, 42, 26],   t: [-1, 0, 1] },
  'Piscina': { p: [20, 4, 20],    t: [4, 1.2, 5] },
  'Varanda': { p: [-15, 2.6, 12], t: [-6, 1.8, 0] },
  'Fundos':  { p: [-8, 6, -24],   t: [1, 2, -2] },
};
let tween = null;
function flyTo(v) {
  controls.autoRotate = false; syncRotBtn();
  tween = { t0: performance.now(), dur: 1400, p0: camera.position.clone(), q0: controls.target.clone(), p1: new THREE.Vector3(...v.p), q1: new THREE.Vector3(...v.t) };
}
const viewGroup = group('Vista', Object.keys(views), n => flyTo(views[n]));
group('Telhado', Object.keys(roofPalette), setRoof, 'Cerâmica');
group('Terreno', ['Gramado', 'Em obra'], n => { const lawn = n === 'Gramado'; paintGround(lawn ? 'lawn' : 'red'); vegetation.forEach(v => v.visible = lawn); }, 'Gramado');
group('Horário', Object.keys(presets), setTime, 'Dia');
const rotGroup = group('', ['Giro automático'], () => { controls.autoRotate = !controls.autoRotate; syncRotBtn(); });
function syncRotBtn() { rotGroup?.querySelector('button').classList.toggle('on', controls.autoRotate); }
syncRotBtn();

paintGround('lawn');
setTime('Dia');

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
window.__set = (p, t) => { controls.autoRotate = false; camera.position.set(...p); controls.target.set(...t); controls.update(); };

renderer.setAnimationLoop(now => {
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.q0, tween.q1, e);
    if (k >= 1) tween = null;
  }
  controls.update();
  renderer.render(scene, camera);
});
requestAnimationFrame(() => requestAnimationFrame(() => { const l = document.getElementById('loading'); l.style.opacity = 0; setTimeout(() => l.remove(), 700); }));
</script>
</body>
</html>
